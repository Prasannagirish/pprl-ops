name: Auto-sync trips to Google Sheets

# Hits the deployed /api/cron/sync endpoint on a schedule so trips sync to
# the sheet automatically, without anyone clicking "Force Sync" or
# needing Vercel Pro's per-minute cron jobs (Vercel Hobby cron jobs are
# capped at once per day, which is too slow for this).
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   APP_URL     e.g. https://pprl-ops.vercel.app
#   CRON_SECRET same value as the CRON_SECRET env var set on Vercel

on:
  schedule:
    - cron: "*/5 * * * *" # every 5 minutes, UTC
  workflow_dispatch: {} # lets you trigger a sync manually from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call sync endpoint
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/sync"